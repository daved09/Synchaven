[package]
name = "synchaven"
version = "0.0.0" # Placeholder – the version is in version.properties (see build.rs)
edition = "2021"
description = "Synchaven – calendar and contacts backend with REST API and CardDAV"
license = "AGPL-3.0-only"
repository = "https://github.com/daved09/Synchaven"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
hkdf = "0.13.0"
hmac = "0.13"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
quick-xml = "0.42.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rrule = "0.14"
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
