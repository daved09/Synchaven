[package]
name = "synchaven"
version = "0.0.0" # Platzhalter – die Version steht in version.properties (siehe build.rs)
edition = "2021"
description = "Synchaven – Kalender- und Kontakt-Backend mit REST API und CardDAV"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
jsonwebtoken = "9"
quick-xml = "0.42.0"
rand = "0.8"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
