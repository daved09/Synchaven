services:
  Synchaven:
    # build.sh writes SYNCHAVEN_IMAGE and SYNCHAVEN_VERSION to .env; without it the published image is used
    image: ${SYNCHAVEN_IMAGE:-ghcr.io/daved09/synchaven}:${SYNCHAVEN_VERSION:-latest}
    container_name: synchaven
    restart: unless-stopped
    ports:
      # Only reachable from this machine – put a reverse proxy with HTTPS in front (Caddy, Traefik, nginx).
      # To reach the server directly from other devices (e.g. on the home network), use "8080:8080" instead.
      - "127.0.0.1:8080:8080"
    environment:
      # Initial setup: the first account becomes administrator and needs the setup token that the server
      # prints at startup (`docker logs synchaven`, also in /data/setup_token).
      # Let further people register themselves ("true"), or create their accounts in the admin page ("false").
      # Can also be toggled under Account → Administration; a value stored there takes precedence.
      ALLOW_REGISTRATION: "false"
      # Lifetime of sign-in tokens in days
      TOKEN_TTL_DAYS: "30"
      # Other web pages that may call the API (comma-separated, "*" = all). Not needed for the web UI,
      # the app or CardDAV; without it, browsers only allow the web UI itself (same origin).
      # CORS_ORIGINS: "https://other.example.org"
      # Optional: fixed key for the two-factor secrets (≥ 32 characters), e.g. kept outside /data.
      # If not set, one is generated in /data/totp_key – keep it with your backups of the database.
      # TOTP_ENCRYPTION_KEY: "please-replace-with-a-long-random-value"
      # Optional: fixed setup token for the first account (≥ 16 characters) instead of a random one
      # SETUP_TOKEN: "..."
      # Optional: fixed JWT secret (≥ 32 characters). If not set, one is generated in /data.
      # JWT_SECRET: "please-replace-with-a-long-random-value"
      # User/group ID the program runs as and that owns /data.
      # For a bind mount (e.g. ./data:/data) enter your own IDs: `id -u` / `id -g`
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - synchaven-data:/data
      # Alternatively a directory on the host (then set PUID/PGID):
      # - ./data:/data

volumes:
  synchaven-data:
