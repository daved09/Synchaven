services:
  Synchaven:
    image: ghcr.io/daved09/synchaven:${SYNCHAVEN_VERSION}
    container_name: synchaven
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Neue Konten erlauben (nach dem Anlegen der eigenen Konten auf "false" setzen)
      ALLOW_REGISTRATION: "true"
      # Gültigkeit der Anmelde-Tokens in Tagen
      TOKEN_TTL_DAYS: "30"
      # Erlaubte Origins für Browser-Zugriffe von fremden Domains (kommagetrennt, "*" = alle)
      CORS_ORIGINS: "*"
      # Optional: festes JWT-Secret (≥ 32 Zeichen). Ohne Angabe wird eines in /data erzeugt.
      # JWT_SECRET: "bitte-durch-einen-langen-zufallswert-ersetzen"
    volumes:
      - synchaven-data:/data

volumes:
  synchaven-data:
