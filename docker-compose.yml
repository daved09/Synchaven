services:
  Synchaven:
    image: ghcr.io/daved09/synchaven:${SYNCHAVEN_VERSION}
    container_name: synchaven
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Allow new accounts (set to "false" after creating your own accounts).
      # The first registered account becomes administrator (Account → Administration). Registration can
      # also be toggled there; a value stored there takes precedence.
      ALLOW_REGISTRATION: "true"
      # Lifetime of sign-in tokens in days
      TOKEN_TTL_DAYS: "30"
      # Allowed origins for browser access from other domains (comma-separated, "*" = all)
      CORS_ORIGINS: "*"
      # Optional: fixed JWT secret (≥ 32 characters). If not set, one is generated in /data.
      # JWT_SECRET: "please-replace-with-a-long-random-value"
      # User/group ID the program runs as and that owns /data.
      # For a bind mount (e.g. ./data:/data) enter your own IDs: `id -u` / `id -g`
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - synchaven-data:/data
      # Alternatively a directory on the host (then set PUID/PGID):
      # - ./data:/data

volumes:
  synchaven-data:
