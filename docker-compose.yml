services:
  Synchaven:
    image: ghcr.io/daved09/synchaven:${SYNCHAVEN_VERSION}
    container_name: synchaven
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Neue Konten erlauben (nach dem Anlegen der eigenen Konten auf "false" setzen).
      # Das erste registrierte Konto wird Administrator (Export/Import unter Einstellungen → Verwaltung).
      ALLOW_REGISTRATION: "true"
      # Gültigkeit der Anmelde-Tokens in Tagen
      TOKEN_TTL_DAYS: "30"
      # Erlaubte Origins für Browser-Zugriffe von fremden Domains (kommagetrennt, "*" = alle)
      CORS_ORIGINS: "*"
      # Optional: festes JWT-Secret (≥ 32 Zeichen). Ohne Angabe wird eines in /data erzeugt.
      # JWT_SECRET: "bitte-durch-einen-langen-zufallswert-ersetzen"
      # Benutzer-/Gruppen-ID, mit der das Programm läuft und der /data gehört.
      # Für einen Bind-Mount (z. B. ./data:/data) die eigenen IDs eintragen: `id -u` / `id -g`
      # PUID: "1000"
      # PGID: "1000"
    volumes:
      - synchaven-data:/data
      # Alternativ ein Verzeichnis auf dem Host (dann PUID/PGID setzen):
      # - ./data:/data

volumes:
  synchaven-data:
